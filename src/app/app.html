<div class="container my-5">
  <h1>Shopping Cart</h1>
  <div class="row my-5">
    <div class="col-lg-6 ">
      <div class="item bg-primary rounded-3 me-3 py-4">
        <h3>Total Items</h3>
        <h2>{{totalItems()}}</h2>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="item bg-success rounded-3 py-4">
        <h3>Total Price</h3>
        <h2>${{totalPrice()}}</h2>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    @for(product of products();track product){
      <div class="itemCard col-lg-3">
        <div class="card" style="width: 18rem;">
          <img src="assets/images/{{product.img}}" class="card-img-top img-fluid" alt="...">
          <div class="card-body">
            <h5 class="card-title">{{product.name}}</h5>
            <p class="card-text">Price : ${{product.price}}</p>
            <p class="qun">Quantity : <span class="bg-secondary rounded-3">{{product.quantity}}</span></p>
            <p class="fw-bolder">Subtotal : ${{product.price * product.quantity}}</p>
            <div class="buttons">
              <button class="btn btn-primary me-3"(click)="addItem(product.id)">Add</button>
              <button class="btn btn-danger  {{(product.quantity==0)?'disabled':' '}}" (click)="removeItem(product.id)">Remove</button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
